[workspace]
resolver = "2"
members = ["src-tauri", "crates/core", "crates/cli", "crates/fuse", "crates/winsync"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/crispy-09/skyfolder"

[workspace.dependencies]
skyfolder-core = { path = "crates/core" }
skyfolder-fuse = { path = "crates/fuse" }
skyfolder-winsync = { path = "crates/winsync" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
libc = "0.2"
